version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      terraform-providers:
        patterns:
          - "hashicorp/*"
          - "microsoft/*"
      terraform-modules:
        patterns:
          - "*"
        exclude-patterns:
          - "hashicorp/*"
          - "microsoft/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"