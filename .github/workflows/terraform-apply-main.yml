name: Terraform Apply (Main)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    uses: ./.github/workflows/terraform-run.yml
    secrets: inherit
    with:
      command: apply
      # Requires manual approval from the environment's protection rules before applying to the tenant.
      environment_name: production
