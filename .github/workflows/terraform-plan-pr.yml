name: Terraform Plan (PR)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/**/*.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  terraform-plan:
    uses: ./.github/workflows/terraform-run.yml
    secrets: inherit
    with:
      command: plan
