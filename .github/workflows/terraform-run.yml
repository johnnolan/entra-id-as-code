name: Terraform Run

on:
  workflow_call:
    inputs:
      command:
        description: Terraform command to run after validate.
        required: true
        type: string
      plan_detailed_exitcode:
        description: Run terraform plan with -detailed-exitcode and expose outputs.
        required: false
        default: false
        type: boolean
    outputs:
      plan_exit_code:
        description: Exit code from detailed plan mode (0 no drift, 2 drift).
        value: ${{ jobs.terraform.outputs.plan_exit_code }}
      plan_output:
        description: Tail of plan output from detailed plan mode.
        value: ${{ jobs.terraform.outputs.plan_output }}

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  terraform:
    name: Terraform ${{ inputs.command }}
    runs-on: ubuntu-latest
    outputs:
      plan_exit_code: ${{ steps.drift_plan.outputs.exit_code }}
      plan_output: ${{ steps.drift_plan.outputs.plan_output }}
    defaults:
      run:
        shell: bash
        working-directory: terraform

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_client_id: ${{ secrets.ARM_CLIENT_ID }}
      TF_VAR_tenant_id: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e

      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.52.0
          cache: true

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER_NAME }}" \
            -backend-config="key=${{ secrets.TFSTATE_KEY || 'terraform.tfstate' }}" \
            -backend-config="tenant_id=${{ secrets.ARM_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.ARM_CLIENT_ID }}" \
            -backend-config="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ inputs.command == 'plan' && inputs.plan_detailed_exitcode == false }}
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color > plan_output_tail.txt 2>&1
          plan_exit_code=$?
          set -e

          cat plan_output_tail.txt

          if [ "${plan_exit_code}" -eq 1 ]; then
            exit 1
          elif [ "${plan_exit_code}" -eq 2 ]; then
            echo "### :warning: Terraform plan has changes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :white_check_mark: No Terraform changes detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Terraform Plan (Detailed Exit Code)
        id: drift_plan
        if: ${{ inputs.command == 'plan' && inputs.plan_detailed_exitcode == true }}
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color > plan_output.txt 2>&1
          plan_exit_code=$?
          set -e

          echo "exit_code=${plan_exit_code}" >> "$GITHUB_OUTPUT"

          if [ "${plan_exit_code}" -eq 1 ]; then
            echo "Terraform plan failed"
            cat plan_output.txt
            exit 1
          fi

          tail -n 250 plan_output.txt > plan_output_tail.txt
          {
            echo "plan_output<<EOF"
            cat plan_output_tail.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment Plan on PR
        if: ${{ inputs.command == 'plan' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Terraform Plan"
            echo '```'
            cat plan_output_tail.txt
            echo '```'
          } > comment_body.txt
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment_body.txt

      - name: Terraform Apply
        if: ${{ inputs.command == 'apply' }}
        run: terraform apply -auto-approve -input=false -no-color