name: Terraform Run

on:
  workflow_call:
    inputs:
      command:
        description: Terraform command to run after validate.
        required: true
        type: string
      plan_detailed_exitcode:
        description: Run terraform plan with -detailed-exitcode and expose outputs.
        required: false
        default: false
        type: boolean
    outputs:
      plan_exit_code:
        description: Exit code from detailed plan mode (0 no drift, 2 drift).
        value: ${{ jobs.terraform.outputs.plan_exit_code }}
      plan_output:
        description: Tail of plan output from detailed plan mode.
        value: ${{ jobs.terraform.outputs.plan_output }}
      plan_summary:
        description: Formatted plan summary markdown, for callers to post as a PR comment.
        value: ${{ jobs.terraform.outputs.plan_summary }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.command }}
    runs-on: ubuntu-latest
    outputs:
      plan_exit_code: ${{ steps.drift_plan.outputs.exit_code }}
      plan_output: ${{ steps.drift_plan.outputs.plan_output }}
      plan_summary: ${{ steps.tf-plan-summary.outputs.summary_content }}
    defaults:
      run:
        shell: bash
        working-directory: terraform

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_client_id: ${{ secrets.ARM_CLIENT_ID }}
      TF_VAR_tenant_id: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get runner public IP
        id: runner_ip
        run: echo "ip=$(curl -sf https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca #v3.0.1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Allow runner IP on state storage account
        run: |
          az storage account network-rule add \
            --resource-group "${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}" \
            --account-name "${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            --ip-address "${{ steps.runner_ip.outputs.ip }}"
          sleep 10

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        name: Setup TFLint
        with:
          tflint_version: v0.52.0
          cache: true
          tflint_config_path: terraform/.tflint.hcl

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER_NAME }}" \
            -backend-config="key=${{ secrets.TFSTATE_KEY || 'terraform.tfstate' }}" \
            -backend-config="tenant_id=${{ secrets.ARM_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.ARM_CLIENT_ID }}" \
            -backend-config="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}"

      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        run: >
          terraform plan -input=false -no-color -out=tfplan &&
          terraform show -no-color tfplan > plan.txt &&
          terraform show -json tfplan > plan.json

      - name: Upload Plan Artifact
        id: upload-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan
          path: '**/plan.*'
          overwrite: true

      - name: Terraform Plan (Detailed Exit Code)
        id: drift_plan
        if: ${{ inputs.command == 'plan' && inputs.plan_detailed_exitcode == true }}
        run: |
          # Derive drift from pre-generated plan JSON; 0 = no changes, 2 = changes
          has_changes=$(jq '([.resource_changes[]? | select(.change.actions | . != ["no-op"] and . != ["read"])] | length) > 0' plan.json)

          if [ "${has_changes}" = "true" ]; then
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

          tail -n 250 plan.txt > plan_output_tail.txt
          {
            echo "plan_output<<EOF"
            cat plan_output_tail.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        if: ${{ inputs.command == 'apply' }}
        run: terraform apply -auto-approve -input=false -no-color

      # -- Create string output of Terraform Plan
      - name: Create String Output
        id: tf-plan-string
        env:
          ARTIFACT_URL: ${{ steps.upload-plan.outputs.artifact-url }}
        run: |
          summary_file="${RUNNER_TEMP}/terraform-plan-summary.md"
          files_found=$(find . -type f -name "plan*.txt")

          if [ -z "$files_found" ]; then
            echo "No plan files found. Skipping PR comment."

            echo "has_plans=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_plans=true" >> "$GITHUB_OUTPUT"
            echo "summary_file=${summary_file}" >> "$GITHUB_OUTPUT"

            {
              echo "## 🌍 Terraform Plan Outputs"
              echo "Below are the plan results. Expand the sections below to see the full plan details."
              echo ""

              # Find all files matching 'plan-*.txt' recursively and loop through them
              find . -type f -name "plan*.txt" | sort | while read -r file; do
                # Extract just the filename (e.g., "plan-LIVE.txt") to use in the header
                filename=$(basename "$file")
                file_size=$(stat -c%s "$file")
                line_count=$(wc -l < "$file")
                echo "Stats for file size: ${file_size} bytes and line count: ${line_count} lines."
                echo ""
                echo "[⬇️ Download the terraform-plan artifact](${ARTIFACT_URL})"
                echo "<details><summary>📝 Expand Plan: <b>$filename</b></summary>"
                echo ""
                echo '```terraform'
                if [ "${file_size}" -gt 512000 ]; then
                  echo "⚠️ Plan output is over 500kb. Download the terraform-plan to view the full plan details."
                  tail -n 2 "$file"
                elif [ "${line_count}" -gt 450 ]; then
                  echo "⚠️ Plan is more than 500 lines. Download the terraform-plan to view the full plan details."
                  tail -n 2 "$file"
                else
                  cat "$file"
                fi
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              done
            } > "$summary_file"
          fi

      # -- Publish Terraform Plan as task summary
      - name: Publish Terraform Plan to Task Summary
        id: tf-plan-summary
        if: steps.tf-plan-string.outputs.has_plans == 'true'
        run: |
          cat "${{ steps.tf-plan-string.outputs.summary_file }}" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "summary_content<<EOF"
            cat "${{ steps.tf-plan-string.outputs.summary_file }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Remove runner IP from state storage account
        if: always()
        run: |
          az storage account network-rule remove \
            --resource-group "${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}" \
            --account-name "${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            --ip-address "${{ steps.runner_ip.outputs.ip }}"
