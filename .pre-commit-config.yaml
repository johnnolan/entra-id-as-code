repos:
  - repo: local
    hooks:
      - id: terraform-fmt-recursive
        name: Terraform fmt (recursive)
        entry: bash -c 'cd terraform && terraform fmt -recursive'
        language: system
        pass_filenames: false
        types: [terraform]

      - id: tflint-terraform
        name: TFLint
        entry: bash -c 'cd terraform && tflint --recursive'
        language: system
        pass_filenames: false
        types: [terraform]

      - id: terraform-graph
        name: Terraform Graph
        entry: bash -c 'cd terraform && terraform graph > terraform-graph.dot'
        language: system
        pass_filenames: false
        types: [terraform]
